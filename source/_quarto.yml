project:
  type: website
  output-dir: ../docs

website:
  title: "Chris Kornaros"
  twitter-card: true
  open-graph: true
  google-analytics: 
    tracking-id: "G-J1EQMCS7CC"
    anonymize-ip: true
  cookie-consent: 
    type: express
    style: headline
    palette: dark
  repo-url: https://github.com/ChrisKornaros/ChrisKornaros.github.io
  repo-actions: [source, issue]
  page-footer: 
    background: danger
    center:
      - icon: github
        text: GitHub
        href: https://www.github.com/ChrisKornaros
      - icon: linkedin
        text: LinkedIn
        href: https://www.linkedin.com/in/chris-kornaros
      - text: Bluesky
        href: https://bsky.app/profile/chriskornaros.bsky.social
      - icon: envelope-arrow-up-fill
        text: Email
        href: https://forms.gle/gDEjGD9G6VkaxkWX6 
  navbar:
    search: true
    background: danger
    foreground: light
    # Top-level links only; per-post discovery is handled by the listing pages
    # and the directory-auto sidebars below, so publishing never edits this file.
    left:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: pages/about/about.qmd
      - text: "Guides"
        href: pages/guides/guides.qmd
      - text: "Research"
        href: pages/research/research.qmd
      - text: "Blogs"
        href: pages/blogs/blogs.qmd
      - text: "Recipes"
        href: recipes/index.qmd

  # Sidebars auto-list a directory (not hand-listed posts) so a freshly published
  # file appears automatically -- no _quarto.yml edit per publish. NOTE: use a
  # directory path (e.g. "pages/guides/posts"); bare globs like ".../*.qmd" render
  # as literal text in Quarto 1.9, and `auto:` on an empty/missing dir aborts render.
  # Each section's sidebar is attached to its posts by a pages/<section>/_metadata.yml
  # (`sidebar: <id>`), so the nav persists when a reader opens an individual post.
  sidebar:
    - id: guides
      title: "Guides"
      style: "docked"
      background: dark
      foreground: light
      collapse-level: 2
      contents:
        - section: "Guides"
          href: pages/guides/guides.qmd
          contents: "pages/guides/posts"

    - id: research
      title: "Research"
      style: "docked"
      background: dark
      foreground: light
      collapse-level: 2
      contents:
        - section: "Research"
          href: pages/research/research.qmd
          # No posts yet; add `- auto: "/pages/research/posts/*.qmd"` once
          # pages/research/posts/ has content (an empty auto: glob crashes render).

    - id: blogs
      title: "Blogs"
      style: "docked"
      background: dark
      foreground: light
      collapse-level: 2
      contents:
        - section: "Blogs"
          href: pages/blogs/blogs.qmd
          contents: "pages/blogs/posts"

    - id: recipes
      title: "Recipes"
      style: "docked"
      background: dark
      foreground: light
      collapse-level: 2
      # Recipes are FLAT: recipes/<slug>.qmd, slug = content_manager's
      # slugify(title), so CM's <recipes_dir>/<slug>.qmd lookup resolves every
      # page with no per-recipe override. The old per-category index pages are
      # gone; each category link below targets the single listing page's
      # category filter via its `#category=` hash (quarto-listing.js applies it
      # on load and on hashchange), URI-encoded (space -> %20, & -> %26). Do NOT
      # switch to a directory listing ("recipes") -- it would embed all ~120
      # recipes into every page's sidebar (~1k lines/page). Publishing a recipe
      # needs NO edit here; only a brand-new category adds one link below.
      contents:
        - text: "All Recipes"
          href: recipes/index.qmd
        - section: "Categories"
          contents:
            - text: "Baked Goods"
              href: "/recipes/index.html#category=Baked%20Goods"
            - text: "Beef"
              href: "/recipes/index.html#category=Beef"
            - text: "Chicken"
              href: "/recipes/index.html#category=Chicken"
            - text: "Cod"
              href: "/recipes/index.html#category=Cod"
            - text: "Cookbook"
              href: "/recipes/index.html#category=Cookbook"
            - text: "Cooking & Kitchen Tips"
              href: "/recipes/index.html#category=Cooking%20%26%20Kitchen%20Tips"
            - text: "Drinks"
              href: "/recipes/index.html#category=Drinks"
            - text: "Japan"
              href: "/recipes/index.html#category=Japan"
            - text: "Masterclass Recipes"
              href: "/recipes/index.html#category=Masterclass%20Recipes"
            - text: "Mexican"
              href: "/recipes/index.html#category=Mexican"
            - text: "New Orleans"
              href: "/recipes/index.html#category=New%20Orleans"
            - text: "Noodles"
              href: "/recipes/index.html#category=Noodles"
            - text: "Oils and Marinades"
              href: "/recipes/index.html#category=Oils%20and%20Marinades"
            - text: "Party Snacks and Dips"
              href: "/recipes/index.html#category=Party%20Snacks%20and%20Dips"
            - text: "Pickling and Fermenting"
              href: "/recipes/index.html#category=Pickling%20and%20Fermenting"
            - text: "Pizza"
              href: "/recipes/index.html#category=Pizza"
            - text: "Pork"
              href: "/recipes/index.html#category=Pork"
            - text: "Potatoes"
              href: "/recipes/index.html#category=Potatoes"
            - text: "Salads"
              href: "/recipes/index.html#category=Salads"
            - text: "Sandwiches"
              href: "/recipes/index.html#category=Sandwiches"
            - text: "Sauces and Condiments"
              href: "/recipes/index.html#category=Sauces%20and%20Condiments"
            - text: "Soups"
              href: "/recipes/index.html#category=Soups"
            - text: "Spice Mixes"
              href: "/recipes/index.html#category=Spice%20Mixes"
            - text: "Tofu"
